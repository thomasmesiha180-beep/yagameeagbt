<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multi-Mode AI</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f1115 0%, #161920 100%);
            color: #ffffff;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: #1a1d24;
            border-right: 1px solid #262b35;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .main-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #007bff, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-container {
            flex: 1;
            background: #151515;
            border: 1px solid #2d3343;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .bubble {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 70%;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .bubble-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
            border-radius: 18px 18px 2px 18px;
        }
        .bubble-bot {
            align-self: flex-start;
            background: #222630;
            border: 1px solid #2d3343;
            border-radius: 18px 18px 18px 2px;
        }
        .label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .label-bot { color: #00ffcc; }
        .label-user { color: #cbd5e1; }
        .input-container {
            max-width: 800px;
            width: 100%;
            margin: 15px auto 0 auto;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 14px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
        }
        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .radio-group label {
            display: block;
            padding: 12px;
            background: #2a2a2a;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .radio-group input { display: none; }
        .radio-group input:checked + span { color: #00ffcc; font-weight: bold; }
        .radio-group label.active { border-color: #007bff; background: #222630; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>🎛️ Controller Matrix</h3>
        <div class="radio-group">
            <label class="mode-option active"><input type="radio" name="mode" value="regular" checked onchange="switchMode(this)"> <span>Xeus 🧑‍💻 (Regular)</span></label>
            <label class="mode-option"><input type="radio" name="mode" value="egyptian" onchange="switchMode(this)"> <span>YaGammea'GBT 🦅 (Egyptian)</span></label>
            <label class="mode-option"><input type="radio" name="mode" value="coding" onchange="switchMode(this)"> <span>CodeGPT 🚀 (Senior Dev)</span></label>
        </div>
        <button onclick="clearChat()" style="background: #333; width: 100%;">🔄 Reset Memory</button>
    </div>

    <div class="main-content">
        <div class="main-title">⚡ Nexus Multi-Mode AI</div>
        <div class="chat-container" id="chatbox"></div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Compose a transaction message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let currentMode = "regular";
        let memory = [];

        const PROMPTS = {
            egyptian: "Your name is YaGammea'GBT. You are a hilarious Egyptian chatbot. You must ONLY speak in Egyptian Arabic (اللهجة المصرية). Use heavy Egyptian humor, sarcasm, jokes and street slang like 'يا باشا', 'يا عم', 'فكك مني'. Act like a funny, street-smart Egyptian friend.",
            coding: "Your name is CodeGPT. You are an elite, world-class Senior Software Engineer. Provide concise, production-ready code blocks. Prioritize clean, optimized syntax.",
            regular: "Your name is Xeus. You are a friendly everyday conversational assistant. Keep your answers clear, polite, and casual."
        };

        const BOT_NAMES = { regular: "Xeus", egyptian: "YaGammea'GBT", coding: "CodeGPT" };

        function switchMode(el) {
            currentMode = el.value;
            document.querySelectorAll('.mode-option').forEach(l => l.classList.remove('active'));
            el.parentElement.classList.add('active');
            clearChat();
        }

        function clearChat() {
            memory = [];
            document.getElementById("chatbox").innerHTML = `<p style="color:#666; text-align:center;">--- Matrix switched to ${BOT_NAMES[currentMode]}. Context reset. ---</p>`;
        }

        async function sendMessage() {
            let input = document.getElementById("userInput");
            let text = input.value.trim();
            if(!text) return;

            let chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class="bubble bubble-user"><div class="label label-user">You</div>${text}</div>`;
            memory.push({"role": "user", "content": text});
            input.value = "";
            chatbox.scrollTop = chatbox.scrollHeight;

            // Combine system prompt and full history into a neat array
            let messages = [{"role": "system", "content": PROMPTS[currentMode]}];
            memory.forEach(msg => messages.push(msg));

            try {
                // Formatting as an explicit URL parameter cleanly bypasses browser locks
                let encodedData = encodeURIComponent(JSON.stringify(messages));
                let response = await fetch(`https://pollinations.ai{encodeURIComponent(PROMPTS[currentMode])}&messages=${encodedData}`);
                
                let aiResponse = await response.text();
                aiResponse = aiResponse.trim();
                
                chatbox.innerHTML += `<div class="bubble bubble-bot"><div class="label label-bot">${BOT_NAMES[currentMode]}</div>${aiResponse}</div>`;
                memory.push({"role": "assistant", "content": aiResponse});
                chatbox.scrollTop = chatbox.scrollHeight;
            } catch(e) {
                chatbox.innerHTML += `<div class="bubble bubble-bot" style="color: #ff4444;"><div class="label label-bot">System</div>Transmission glitch. Please try sending again!</div>`;
                chatbox.scrollTop = chatbox.scrollHeight;
            }
        }
        clearChat();
    </script>
</body>
</html>
